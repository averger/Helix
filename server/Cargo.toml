[package]
name = "helix-server"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Helix machine-control server — modern front-of-house for the LinuxCNC realtime core"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
strip = true
